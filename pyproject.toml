[project]
name = "repo-viz"
version = "0.1.0"
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
    "mcp>=2.2.0,<3",
    "pyyaml>=6.0.4",
]

[project.scripts]
repo-viz = "repo_viz.cli:app"
repo-viz-autogen = "repo_viz.autogen.cli:app"
repo-viz-mcp = "repo_viz.mcp_server:app"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "pyright>=1.1.0",
    "pre-commit>=4.6.2",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_viz"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".venv", ".git", "__pycache__", "dist", "build", ".pytest_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["repo_viz"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: deterministic, isolated; assigned from tests/unit/",
    "integration: cross-repo or service interaction; assigned from tests/integration/",
    "contract: validates a supported external boundary (CI-only); assigned from tests/contract/",
    "live: requires external services or credentials; opt-in only",
    "slow: slow tests (>5s); opt-in only",
]
