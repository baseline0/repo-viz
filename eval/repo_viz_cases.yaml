schema_version: 1
suite: repo-viz-evaluation
cases:
  - id: CASE-01
    category: read_only_by_default
    input: "list_tools() with no write opt-in"
    expected_decision: "allow"
    expected_status: "READ_TOOLS_ONLY"
    note: "The default server exposes only read capabilities"

  - id: CASE-02
    category: write_opt_in
    input: "list_tools() with --allow-write"
    expected_decision: "allow"
    expected_status: "WRITE_TOOLS_PRESENT"
    note: "Writing tools appear only with the explicit opt-in"

  - id: CASE-03
    category: forbidden_terms
    input: "tool name or docstring containing approval verbs"
    expected_decision: "deny"
    expected_status: "FORBIDDEN_TERM"
    note: "TL-4 forbids approval words in MCP tool names and docstrings"
